name: Publish Tibia Command 7.4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify guides and forms
        run: |
          node scripts/build-guide-pages.cjs
          node scripts/test-guide-pages.cjs
          node scripts/test-static-minimaps.cjs
          node scripts/test-library-pages.cjs
          node scripts/test-quest-version-policy.cjs
          node scripts/test-quest-history-review.cjs
          node scripts/test-visits.cjs
          node scripts/test-analytics.cjs
          node scripts/test-downloads.cjs
          node scripts/test-map-downloads.cjs
          node scripts/test-catalog.cjs
          node scripts/test-item-review.cjs
          node scripts/test-npc-review.cjs
          node scripts/test-spell-design.cjs
          node scripts/test-creatures.cjs
          node scripts/test-calculator.cjs
          node scripts/test-launch-pages.cjs
          node scripts/test-adsense.cjs
          node scripts/test-quest-routes.cjs
          node scripts/test-quest-directory.cjs
          node scripts/test-hunts.cjs
          node scripts/test-hunt-finder.cjs
          node scripts/test-classic-resources.cjs
          node scripts/test-library-search.cjs
          node scripts/test-account-page.cjs
          node scripts/test-character-tools.cjs
          node scripts/test-material-plans.cjs
          node scripts/test-journal-sync.cjs
          node scripts/test-adventure-planning.cjs
          node scripts/test-hunt-tools.cjs
          node scripts/test-goal-tools.cjs
          node scripts/test-community-auth.cjs
          node scripts/test-catalog-navigation.cjs
      - name: Verify Mythera integration
        run: |
          node scripts/test-mythera-production.cjs
          node scripts/test-server-navigation.cjs
          node scripts/test-mythera-review.cjs
          node scripts/test-mythera-items.cjs
          node scripts/test-mythera-access.cjs
          node scripts/test-mythera-wiki.cjs
          node scripts/test-mythera-professions.cjs
          node scripts/test-mythera-crafting.cjs
          node scripts/test-mythera-mining.cjs
          node scripts/test-mythera-farming.cjs
          node scripts/test-mythera-profession-navigation.cjs
          node scripts/test-mythera-attributes.cjs
          node scripts/test-mythera-systems.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

