<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380"><title>Key 3350: coleta no mosteiro</title><rect width="680" height="380" rx="18" fill="#142225"/><g font-family="sans-serif" fill="#eee"><text x="30" y="45" font-size="24">ISLE OF THE KINGS · KEY 3350</text><text x="30" y="76" font-size="15" fill="#b5c9ca">Esquema de ações — não é planta nem caminho em escala</text><rect x="30" y="105" width="620" height="75" rx="10" fill="#274348"/><text x="50" y="135" font-size="20">1  Estante próxima de Costello · térreo</text><text x="50" y="162" font-size="17">Use → bolsa → Key 3350 + Monastery Intruders</text><path d="M340 185v30m-8-8 8 8 8-8" stroke="#e7bd74" fill="none" stroke-width="3"/><rect x="30" y="225" width="620" height="66" rx="10" fill="#433a28"/><text x="50" y="253" font-size="20">2  Porta dos andares superiores</text><text x="50" y="279" font-size="17">Área restrita: entrar pode gerar multa para sair da ilha.</text><text x="30" y="330" font-size="15">A chave não libera as catacumbas; elas têm acesso separado.</text><text x="30" y="355" font-size="13" fill="#b5c9ca">Tibia Command · baseado nas fichas Key 3350 e White Raven / TibiaWiki</text></g></svg>