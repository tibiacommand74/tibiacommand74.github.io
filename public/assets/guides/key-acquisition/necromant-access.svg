<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400"><title>Necromant House: referências do acesso</title><rect width="680" height="400" rx="18" fill="#172725"/><g font-family="sans-serif" fill="#eee"><text x="30" y="42" font-size="24">NECROMANT HOUSE · KEY 3701</text><text x="30" y="72" font-size="15" fill="#b6cbc5">Esquema de etapas · não representa os corredores em escala</text><rect x="30" y="95" width="620" height="70" rx="10" fill="#2c4540"/><text x="48" y="123" font-size="19">1  Entrada ao sul · superfície (andar 7)</text><text x="48" y="150" font-size="17">32775, 32344, 7 · Destroy Field + Shovel</text><path d="M340 170v25m-7-7 7 7 7-7" stroke="#e2c181" stroke-width="3" fill="none"/><rect x="30" y="205" width="620" height="70" rx="10" fill="#2c4540"/><text x="48" y="234" font-size="19">2  Subsolo (andar 8) · subida para a casa</text><text x="48" y="260" font-size="17">32781, 32329, 8 · cuidado com os mortos-vivos</text><text x="30" y="320" font-size="18">3  Na casa: suba ao piso superior e confira a foto.</text><text x="30" y="350" font-size="16">A coleta é no chão marcado, junto ao baú.</text><text x="30" y="380" font-size="13" fill="#b6cbc5">Tibia Command · referências: Necromant House e Key 3701 / TibiaWiki</text></g></svg>