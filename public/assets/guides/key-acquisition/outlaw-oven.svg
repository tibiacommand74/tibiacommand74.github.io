<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" role="img" aria-labelledby="title desc"><title id="title">Sequência da alavanca do forno até a Key 3304</title><desc id="desc">Desça pela escada noroeste, abra a porta com 3303 e puxe a alavanca. Volte ao salão e desça pela escada ao sul. Passe atrás do forno e abra o baú da 3304. Esquema de sequência, não planta em escala.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#d6bc79"/></marker></defs><rect width="680" height="490" rx="12" fill="#142320"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="340" y="34" fill="#ead5a0" font-size="22" font-weight="bold">3303 → FORNO → 3304</text><text x="340" y="59" fill="#b7c0b6" font-size="14">Esquema de sequência · não é uma planta em escala</text><rect x="190" y="88" width="300" height="75" rx="9" fill="#243b32" stroke="#8a9e84"/><text x="340" y="118" fill="#f0ebdc" font-size="18">Salão das quatro escadas</text><text x="340" y="143" fill="#c7d0c3" font-size="15">no final da caverna dos Wild Warriors</text><rect x="30" y="238" width="275" height="104" rx="9" fill="#243b32" stroke="#d6bc79"/><text x="167" y="266" fill="#ead5a0" font-size="19" font-weight="bold">1 · Escada noroeste</text><text x="167" y="296" fill="#f0ebdc" font-size="17">Abra a porta com 3303.</text><text x="167" y="323" fill="#f0ebdc" font-size="17">Acione a alavanca.</text><rect x="375" y="238" width="275" height="104" rx="9" fill="#243b32" stroke="#d6bc79"/><text x="512" y="266" fill="#ead5a0" font-size="19" font-weight="bold">3 · Escada ao sul</text><text x="512" y="296" fill="#f0ebdc" font-size="17">Encontre o forno deslocado.</text><text x="512" y="323" fill="#f0ebdc" font-size="17">Passe pelo espaço atrás dele.</text><rect x="375" y="392" width="275" height="62" rx="9" fill="#3e3d23" stroke="#d6bc79"/><text x="512" y="430" fill="#fff0bb" font-size="20" font-weight="bold">Baú: Key 3304</text><text x="175" y="407" fill="#c7d0c3" font-size="14">Não confunda esta alavanca</text><text x="175" y="430" fill="#c7d0c3" font-size="14">com as de Power Ring / barril.</text></g><g fill="none" stroke="#d6bc79" stroke-width="3" marker-end="url(#arrow)"><path d="M220 164L135 218"/><path d="M270 235L294 181"/><path d="M465 164L512 220"/><path d="M512 345V381"/></g><g font-family="Arial,sans-serif" font-size="15" fill="#ead5a0"><text x="290" y="197">2 · Suba de volta</text></g></svg>