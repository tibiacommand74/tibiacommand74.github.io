<svg xmlns="http://www.w3.org/2000/svg" width="680" height="362" viewBox="0 0 680 362"><title>KEY 4023 · ORDEM DO TESTE</title><rect width="680" height="362" rx="18" fill="#172b29"/><g font-family="sans-serif" fill="#eee"><text x="26" y="40" font-size="22">KEY 4023 · ORDEM DO TESTE</text><text x="26" y="70" fill="#bfd1ca" font-size="14">Esquema de consulta · não é minimapa nem rota em escala</text><rect x="24" y="90" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="120" font-size="16">500 gp · hi → Netlios → yes → yes</text><rect x="24" y="148" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="178" font-size="16">1 · Anaso     2 · Elaeus     3 · Gadinius</text><rect x="24" y="206" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="236" font-size="16">4 · Heso      5 · Hestus</text><rect x="24" y="264" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="294" font-size="16">Envie uma resposta por pergunta; confira a chave ao final.</text><text x="26" y="347" font-size="12" fill="#bfd1ca">Tibia Command · baseado nas referências citadas no guia</text></g></svg>