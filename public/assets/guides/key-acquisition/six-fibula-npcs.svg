<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390"><title>Fibula: vendedores da Key 3940 e poço</title><rect width="680" height="390" rx="18" fill="#182b29"/><g fill="#eee" font-family="sans-serif"><text x="28" y="42" font-size="24">FIBULA · KEY 3940</text><text x="28" y="72" font-size="15" fill="#bad0c9">Referências de posição · esquema sem escala, não é minimapa</text><rect x="28" y="95" width="624" height="70" rx="9" fill="#304c45"/><text x="45" y="124" font-size="20">Dermot · 32165, 32437, 7</text><text x="45" y="151" font-size="17">2.000 gp · hi → key → yes</text><rect x="28" y="180" width="624" height="70" rx="9" fill="#304c45"/><text x="45" y="209" font-size="20">Simon · 32186, 32470, 7</text><text x="45" y="236" font-size="17">800 gp · hi → help → yes → yes → yes</text><text x="28" y="295" font-size="19">Poço da vila · 32171, 32439, 7</text><text x="28" y="325" font-size="17">Desça e use 3940 na porta da dungeon, no andar 8.</text><text x="28" y="365" font-size="13" fill="#bad0c9">Tibia Command · referências: Dermot, Simon e Deeper Fibula / TibiaWiki</text></g></svg>