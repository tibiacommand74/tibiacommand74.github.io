<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420"><title>KEY 4037 · POÇÃO PARA NEMAL</title><rect width="680" height="420" rx="18" fill="#172b29"/><g font-family="sans-serif" fill="#eee"><text x="26" y="40" font-size="22">KEY 4037 · POÇÃO PARA NEMAL</text><text x="26" y="70" fill="#bfd1ca" font-size="14">Esquema de consulta · não é minimapa nem rota em escala</text><rect x="24" y="90" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="120" font-size="16">1 Roll + 1 Flour + 1 Lump of Dough</text><rect x="24" y="148" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="178" font-size="16">1 Red Rose + 1 Cherry</text><rect x="24" y="206" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="236" font-size="16">Tempo de preparo: 31 minutos</text><rect x="24" y="264" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="294" font-size="16">Palavras: Nalus Murtu</text><rect x="24" y="322" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="352" font-size="16">Confira Key 4037 · acesso ao Hall of Lost Doors</text><text x="26" y="405" font-size="12" fill="#bfd1ca">Tibia Command · baseado nas referências citadas no guia</text></g></svg>