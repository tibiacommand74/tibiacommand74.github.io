<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420"><title>4022 → 4009 → BIBLIOTECA</title><rect width="680" height="420" rx="18" fill="#172b29"/><g font-family="sans-serif" fill="#eee"><text x="26" y="40" font-size="22">4022 → 4009 → BIBLIOTECA</text><text x="26" y="70" fill="#bfd1ca" font-size="14">Esquema de consulta · não é minimapa nem rota em escala</text><rect x="24" y="90" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="120" font-size="16">Hagor · 1 Roll → recebe Key 4022</text><rect x="24" y="148" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="178" font-size="16">4022 abre o quarto que contém o baú da 4009</text><rect x="24" y="206" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="236" font-size="16">Baú do quarto → recebe Key 4009</text><rect x="24" y="264" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="294" font-size="16">4009 abre a biblioteca: 32628, 32098, 11</text><rect x="24" y="322" width="632" height="48" rx="7" fill="#304941"/><text x="38" y="352" font-size="16">As chaves 4023 e 4037 vêm de outros NPCs</text><text x="26" y="405" font-size="12" fill="#bfd1ca">Tibia Command · baseado nas referências citadas no guia</text></g></svg>